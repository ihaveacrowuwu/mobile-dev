# SwiftLint configuration.
# Run:  cd ios && swiftlint
# Fix:  cd ios && swiftlint --fix  (then `swiftformat .` for layout)

included:
  - SkyCast
  - SkyCastTests
  - SkyCastUITests

excluded:
  - SkyCast.xcodeproj
  - build
  - DerivedData
  - .build

# ── Rules enabled beyond the defaults ────────────────────────────────────────
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  # ── Layout rules SwiftFormat owns ────────────────────────────────────────────
  # SwiftFormat is the formatter; SwiftLint checks correctness and style it cannot
  # fix. Leaving these enabled makes the two tools fight, and every `swiftformat .`
  # would then produce SwiftLint errors:
  #
  #   trailing_comma : .swiftformat sets `--commas always`. Trailing commas in
  #                     collection and argument lists give cleaner diffs (adding a
  #                     line touches one line, not two), which is why we want them.
  #   opening_brace  : .swiftformat sets `--wrapMultilineStatementBraces`, which
  #                     puts `{` on its own line after a wrapped signature. That is
  #                     more readable for long generic signatures than cramming the
  #                     brace onto the last parameter line.
  - trailing_comma
  - opening_brace

  # ── Genuinely not wanted ─────────────────────────────────────────────────────
  # SwiftUI view bodies are declarative; nesting depth is the structure, not a smell.
  - type_body_length
  # `body` and `#Preview` blocks legitimately run long.
  - function_body_length
  # Trailing closures read worse than named arguments in most SwiftUI modifiers.
  - multiple_closures_with_trailing_closure
  # TODOs are allowed when they carry an owner and a reason.
  - todo

# ── Thresholds ───────────────────────────────────────────────────────────────
line_length:
  warning: 120
  error: 140
  ignores_comments: false
  ignores_urls: true

file_length:
  warning: 500
  error: 800

type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length: 2
  excluded:
    - id
    - to
    - at
    - x
    - y

cyclomatic_complexity:
  warning: 12
  error: 20

nesting:
  type_level: 2

# ── Rules that must never be violated ────────────────────────────────────────
# Force unwraps and force tries hide crashes. The only exceptions are the two
# documented `try!` calls on in-memory stores used by previews and tests, where a
# failure genuinely is a programmer error.
force_unwrapping:
  severity: error
force_cast:
  severity: error
force_try:
  severity: error

# `print` bypasses the unified logging system and leaks to release builds.
custom_rules:
  no_print:
    name: "No print()"
    regex: '(?<!\w)print\('
    match_kinds:
      - identifier
    message: "Use OSLog / Logger instead of print()."
    severity: warning
  no_hardcoded_api_key:
    name: "No hardcoded API key"
    # OpenWeather keys are 32 hex characters. Nothing that shape belongs in source.
    regex: '"[0-9a-f]{32}"'
    message: "API keys belong in Config/Secrets.xcconfig, never in source."
    severity: error

reporter: "xcode"
