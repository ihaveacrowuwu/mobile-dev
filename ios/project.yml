# ─────────────────────────────────────────────────────────────────────────────
# XcodeGen project definition: the SINGLE source of truth for SkyCast.xcodeproj.
#
# Why XcodeGen instead of a hand-managed .xcodeproj:
#   • `project.pbxproj` is a generated artefact that merges terribly. Two people
#     adding a file on different branches produces a conflict no one can review.
#   • New Swift files are picked up automatically from the `sources` directories,
#     so nobody can forget to add a file to the target.
#   • Build settings are readable, diffable YAML and .xcconfig files.
#
# Regenerate after editing this file:
#     cd ios && xcodegen generate
#
# NEVER hand-edit SkyCast.xcodeproj/project.pbxproj: it will be overwritten.
# ─────────────────────────────────────────────────────────────────────────────

name: SkyCast

options:
  bundleIdPrefix: com.nauhaan
  deploymentTarget:
    # 26.0, because Liquid Glass is a hard requirement for this project.
    #
    # Every Liquid Glass API (`glassEffect`, `GlassEffectContainer`,
    # `buttonStyle(.glass)`, `tabBarMinimizeBehavior`, `backgroundExtensionEffect`)
    # is iOS 26+. Targeting 26.0 lets the code use them unconditionally instead of
    # being littered with `if #available` and maintaining two visual designs.
    #
    # The cost is real: devices on iOS 17-25 are excluded. Recorded in
    # Liquid Glass.
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  # Fail generation rather than silently produce a project referencing missing files.
  disabledValidations: []

# Shared build settings. Anything environment- or secret-specific lives in the
# .xcconfig files below instead, so it can be gitignored.
configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 strict concurrency. Warnings here are real data races, fix them with
    # correct isolation (`actor`, `@MainActor`, `Sendable`), never by silencing.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_CONCISE_MAGIC_FILE: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEAD_CODE_STRIPPING: true
    CLANG_ENABLE_MODULES: true
    # Treat warnings as errors so the codebase cannot drift.
    GCC_TREAT_WARNINGS_AS_ERRORS: true
    SWIFT_TREAT_WARNINGS_AS_ERRORS: false # flipped on in CI only, see .github/workflows
    CODE_SIGN_STYLE: Automatic
    # Scoped to the simulator SDK, deliberately. Unscoped: which is how this started, it also
    # forbids signing for a *device*, so `Any iOS Device` failed outright and the app could not be
    # put on a phone at all. Scoping keeps simulator and CI builds identity-free while letting a
    # device build sign automatically with whatever team the developer has selected.
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": false
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": false
  configs:
    debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: true
    release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: true

targets:
  # ── App ────────────────────────────────────────────────────────────────────
  SkyCast:
    type: application
    platform: iOS
    sources:
      - path: SkyCast
        excludes:
          - "**/.DS_Store"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        # From a variable so a tester can claim their own identifier in the gitignored
        # Secrets.xcconfig instead of editing this tracked file. Default in Config/Base.xcconfig.
        PRODUCT_BUNDLE_IDENTIFIER: $(SKYCAST_BUNDLE_ID)
        PRODUCT_NAME: SkyCast
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        # Portrait plus both landscapes: the layout is responsive, and locking
        # rotation on a phone-sized app is a usability regression.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: SkyCast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Read at runtime by AppConfiguration. The value is substituted from
        # Config/Secrets.xcconfig, which is gitignored: no key in source control.
        OpenWeatherAPIKey: $(OPEN_WEATHER_API_KEY)
        OpenWeatherBaseURL: https://api.openweathermap.org/
        # No location permission is requested: places are chosen by name, so asking
        # for GPS would be an unjustified prompt.
        ITSAppUsesNonExemptEncryption: false

  # ── Unit tests (Swift Testing) ─────────────────────────────────────────────
  SkyCastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # Includes SkyCastTests/Fixtures/*.json: real captured OpenWeather responses, shared
      # byte-for-byte with android/app/src/test/resources/fixtures/. XcodeGen classifies
      # non-source files as resources automatically and flattens them into the bundle root,
      # which is where Bundle(for:).url(forResource:) looks. Do NOT also declare the folder
      # explicitly: that copies every fixture twice.
      - path: SkyCastTests
    dependencies:
      - target: SkyCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SKYCAST_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: true

  # ── UI tests (XCUITest) ───────────────────────────────────────────────────
  SkyCastUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SkyCastUITests
    dependencies:
      - target: SkyCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SKYCAST_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: SkyCast

schemes:
  SkyCast:
    build:
      targets:
        SkyCast: all
        SkyCastTests: [test]
        SkyCastUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - SkyCast
      targets:
        - SkyCastTests
        - SkyCastUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
