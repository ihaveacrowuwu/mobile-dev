# ── JVM / daemon ────────────────────────────────────────────────────────────
# 4 GB is comfortable for Compose + KSP on Apple silicon. Lower it if the
# machine is memory-constrained; raise it if you see OOM during KSP.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Build performance ───────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# ── Kotlin ──────────────────────────────────────────────────────────────────
kotlin.code.style=official
# Run the Kotlin compiler inside the Gradle daemon: fewer JVMs, faster builds.
kotlin.compiler.execution.strategy=in-process

# ── AndroidX ────────────────────────────────────────────────────────────────
android.useAndroidX=true
# Non-transitive R classes keep each module's R small and build times low.
android.nonTransitiveRClass=true
# Fail the build if a resource is referenced but missing.
android.nonFinalResIds=false

# ── Compose ─────────────────────────────────────────────────────────────────
# Emits recomposition/stability reports under app/build/compose-metrics when the
# `composeCompilerReports` property is passed.
